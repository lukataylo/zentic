# The Zentic app bundle. Generate with `xcodegen generate` (or scripts/build-app.sh);
# Zentic.xcodeproj is generated and ignored, this file is the source of truth.
#
# The app compiles Sources/ZenticMac itself and takes ZenticKit from the Swift
# package in this directory, so `swift run ZenticMac` and the app build the same
# code, and ZenticKit's `Bundle.module` resources travel inside Zentic.app.
name: Zentic

options:
  bundleIdPrefix: com.lukadadiani
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: 5QC5886P5V
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    # Release builds override this with the commit count (scripts/release.sh), so
    # every published build is numbered higher than the last.
    CURRENT_PROJECT_VERSION: "1"
    # Tab sync's iCloud entitlements (App/Zentic-iCloud.entitlements) need a
    # provisioning profile with the iCloud.com.lukadadiani.Zentic container,
    # which Xcode can only make once an Apple account is added in Xcode ›
    # Settings › Accounts. Until then the app builds without them and tab sync
    # hides itself. `scripts/build-app.sh --icloud` turns them on for one
    # build; set YES here once the account is added (README › iCloud tab sync).
    ZENTIC_ICLOUD: NO

packages:
  ZenticPackage:
    path: .

targets:
  Zentic:
    type: application
    platform: macOS
    sources:
      - path: Sources/ZenticMac
      - path: App/Assets.xcassets
    dependencies:
      - package: ZenticPackage
        product: ZenticKit
    # A shared scheme, so xcodebuild need not invent one (it warns when it does)
    # and the UI tests run with `xcodebuild test -scheme Zentic`.
    scheme:
      testTargets:
        - ZenticUITests
    settings:
      base:
        PRODUCT_NAME: Zentic
        PRODUCT_BUNDLE_IDENTIFIER: com.lukadadiani.Zentic
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: $(ZENTIC_ENTITLEMENTS_$(ZENTIC_ICLOUD))
        ZENTIC_ENTITLEMENTS_NO: App/Zentic.entitlements
        ZENTIC_ENTITLEMENTS_YES: App/Zentic-iCloud.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
      configs:
        # Debug signs automatically for this Mac. Release signs manually: Xcode's
        # automatic signing only produces development builds, and a build for
        # other people's Macs must carry Developer ID and a secure timestamp
        # for notarization to accept it.
        Debug:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: Apple Development
          ZENTIC_APS_ENVIRONMENT: development
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Developer ID Application
          OTHER_CODE_SIGN_FLAGS: --timestamp
          ZENTIC_APS_ENVIRONMENT: production

  # XCUITest journeys through the real app (Tests/ZenticUITests). Each test
  # launches Zentic on a fresh ZENTIC_DATA_DIR with --ui-testing, and serves
  # its pages from FixtureServer on 127.0.0.1: no internet, no user data.
  ZenticUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/ZenticUITests
      - path: Tests/ZenticMacTests/Support/FixtureServer.swift
    dependencies:
      - target: Zentic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lukadadiani.ZenticUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Zentic
        CODE_SIGN_ENTITLEMENTS: Tests/ZenticUITests/ZenticUITests.entitlements
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
