62c9ac02353de5f24a4d6fc.png\",\"flair_bg_color\":\"006b94\",\"flair_color\":\"fac731\",\"flair_group_id\":41,\"badges_granted\":[],\"version\":1,\"can_edit\":false,\"can_delete\":false,\"can_recover\":false,\"can_see_hidden_post\":false,\"can_wiki\":false,\"link_counts\":[{\"url\":\"https://us1.discourse-cdn.com/flex002/uploads/python1/original/2X/2/2c441545dc69401836f2d6061e5ed827b2cb9fad.jpeg\",\"internal\":false,\"reflection\":false,\"title\":\"2c441545dc69401836f2d6061e5ed827b2cb9fad.jpeg\",\"clicks\":0}],\"read\":true,\"user_title\":\"CPython core developer\",\"title_is_group\":true,\"bookmarked\":false,\"actions_summary\":[{\"id\":2,\"count\":21}],\"moderator\":true,\"admin\":true,\"staff\":true,\"user_id\":6,\"hidden\":false,\"trust_level\":4,\"deleted_at\":null,\"user_deleted\":false,\"edit_reason\":null,\"can_view_edit_history\":true,\"wiki\":false,\"post_url\":\"/t/pep-703-making-the-global-interpreter-lock-optional/22606/4\",\"reactions\":[{\"id\":\"heart\",\"type\":\"emoji\",\"count\":21}],\"current_user_reaction\":null,\"reaction_users_count\":21,\"current_user_used_main_reaction\":false,\"can_accept_answer\":false,\"can_unaccept_answer\":false,\"accepted_answer\":false,\"topic_accepted_answer\":null},{\"id\":80689,\"name\":\"Barry Scott\",\"username\":\"barry-scott\",\"avatar_template\":\"https://avatars.discourse-cdn.com/v4/letter/b/e9c0ed/{size}.png\",\"created_at\":\"2023-01-10T19:29:02.654Z\",\"cooked\":\"\\u003cp\\u003eThanks you for a clear PEP for such a technically complex change!\\u003c/p\\u003e\\n\\u003cp\\u003eI am the PyCXX maintainer.\\u003c/p\\u003e\\n\\u003cp\\u003eI think I may need to know if PYCXX needs to use \\u003ccode\\u003e—without-gil\\u003c/code\\u003e safe APIs.\\u003c/p\\u003e\\n\\u003cp\\u003eIs there a C define that I can test? Found it: Py_NOGIL\\u003c/p\\u003e\\n\\u003cp\\u003eOr maybe PyCXX always uses the safe APIs starting with the first release of python with this implemented.\\u003c/p\\u003e\\n\\u003cp\\u003eIf a C extension uses an unsafe API will I get a compiler error?\\u003c/p\\u003e\",\"post_number\":5,\"post_type\":1,\"posts_count\":130,\"updated_at\":\"2023-01-10T19:31:47.477Z\",\"reply_count\":1,\"reply_to_post_number\":null,\"quote_count\":0,\"incoming_link_count\":27,\"reads\":468,\"readers_count\":467,\"score\":233.6,\"yours\":false,\"topic_id\":22606,\"topic_slug\":\"pep-703-making-the-global-interpreter-lock-optional\",\"display_username\":\"Barry Scott\",\"primary_group_name\":null,\"flair_name\":null,\"flair_url\":null,\"flair_bg_color\":null,\"flair_color\":null,\"flair_group_id\":null,\"badges_granted\":[],\"version\":1,\"can_edit\":false,\"can_delete\":false,\"can_recover\":false,\"can_see_hidden_post\":false,\"can_wiki\":false,\"read\":true,\"user_title\":null,\"bookmarked\":false,\"actions_summary\":[],\"moderator\":false,\"admin\":false,\"staff\":false,\"user_id\":8068,\"hidden\":false,\"trust_level\":3,\"deleted_at\":null,\"user_deleted\":false,\"edit_reason\":null,\"can_view_edit_history\":true,\"wiki\":false,\"post_url\":\"/t/pep-703-making-the-global-interpreter-lock-optional/22606/5\",\"reactions\":[],\"current_user_reaction\":null,\"reaction_users_count\":0,\"current_user_used_main_reaction\":false,\"can_accept_answer\":false,\"can_unaccept_answer\":false,\"accepted_answer\":false,\"topic_accepted_answer\":null},{\"id\":80717,\"name\":\"H. Vetinari\",\"username\":\"h-vetinari\",\"avatar_template\":\"/user_avatar/discuss.python.org/h-vetinari/{size}/1220_2.png\",\"created_at\":\"2023-01-10T21:51:04.485Z\",\"cooked\":\"\\u003cp\\u003eCongratulations on this PEP! \\u003cimg src=\\\"https://emoji.discourse-cdn.com/apple/partying_face.png?v=12\\\" title=\\\":partying_face:\\\" class=\\\"emoji\\\" alt=\\\":partying_face:\\\" loading=\\\"lazy\\\" width=\\\"20\\\" height=\\\"20\\\"\\u003e\\u003c/p\\u003e\\n\\u003caside class=\\\"quote no-group\\\"\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eThis proposed immortalization scheme is very similar to PEP 683, but with slightly different bit representation in the reference count fields for immortal objects in order to work with biased reference counting and deferred reference counting.\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eI’m surprised to see this diverge from existing efforts in the same direction. Is it impossible to make nogil work with PEP 683 semantics, should PEP 683 be modified, or what are the trade-offs (performance?) if PEP 683 were used as is?\\u003c/p\\u003e\\n\\u003cp\\u003eAnother point that struck me is that, despite investing a lot of digital ink into testimonials, the motivation is almost exclusively ML/AI and scientific computing. I imagine it’s hard to capture the vast volume of discussions on this topic, but my impression is that it does a disservice to the PEP to not cover the impact on other usecases as well, especially considering how the addition of another build mode / ABI will create enormous pressure for \\u003cem\\u003eall\\u003c/em\\u003e extension library authors to support it.\\u003c/p\\u003e\\n\\u003cp\\u003eIn fact, I suspect that pressure would be so high that there wouldn’t be much of a difference to just declaring it as the new default, which then leaves all of the downsides of building everything twice, with few of the benefits of having a build option in the first place\\u003csup class=\\\"footnote-ref\\\"\\u003e\\u003ca href=\\\"#footnote-80717-1\\\" id=\\\"footnote-ref-80717-1\\\"\\u003e[1]\\u003c/a\\u003e\\u003c/sup\\u003e.\\u003c/p\\u003e\\n\\u003chr class=\\\"footnotes-sep\\\"\\u003e\\n\\n\\u003col class=\\\"footnotes-list\\\"\\u003e\\n\\u003cli id=\\\"footnote-80717-1\\\" class=\\\"footnote-item\\\"\\u003e\\u003cp\\u003ePerhaps it might be better to just use this as a “Python 4.0” event, which would at least give library authors something to point to à la “a lot of things changed and we’ll need some time to adapt our library to it”. \\u003ca href=\\\"#footnote-ref-80717-1\\\" class=\\\"footnote-backref\\\"\\u003e↩︎\\u003c/a\\u003e\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003c/ol\\u003e\",\"post_number\":6,\"post_type\":1,\"posts_count\":130,\"updated_at\":\"2023-01-10T22:02:56.493Z\",\"reply_count\":2,\"reply_to_post_number\":null,\"quote_count\":0,\"incoming_link_count\":37,\"reads\":451,\"readers_count\":450,\"score\":420.2,\"yours\":false,\"topic_id\":22606,\"topic_slug\":\"pep-703-making-the-global-interpreter-lock-optional\",\"display_username\":\"H. Vetinari\",\"primary_group_name\":null,\"flair_name\":null,\"flair_url\":null,\"flair_bg_color\":null,\"flair_color\":null,\"flair_group_id\":null,\"badges_granted\":[],\"version\":2,\"can_edit\":false,\"can_delete\":false,\"can_recover\":false,\"can_see_hidden_post\":false,\"can_wiki\":false,\"read\":true,\"user_title\":null,\"bookmarked\":false,\"actions_summary\":[{\"id\":2,\"count\":9}],\"moderator\":false,\"admin\":false,\"staff\":false,\"user_id\":1017,\"hidden\":false,\"trust_level\":2,\"deleted_at\":null,\"user_deleted\":false,\"edit_reason\":null,\"can_view_edit_history\":true,\"wiki\":false,\"post_url\":\"/t/pep-703-making-the-global-interpreter-lock-optional/22606/6\",\"reactions\":[{\"id\":\"heart\",\"type\":\"emoji\",\"count\":9}],\"current_user_reaction\":null,\"reaction_users_count\":9,\"current_user_used_main_reaction\":false,\"can_accept_answer\":false,\"can_unaccept_answer\":false,\"accepted_answer\":false,\"topic_accepted_answer\":null},{\"id\":80724,\"name\":\"Barry Scott\",\"username\":\"barry-scott\",\"avatar_template\":\"https://avatars.discourse-cdn.com/v4/letter/b/e9c0ed/{size}.png\",\"created_at\":\"2023-01-10T22:36:34.956Z\",\"cooked\":\"\\u003cp\\u003eI use case i have at work is a service that uses multi process because of the gil issue.\\u003cbr\\u003e\\nIt handles high volumes of http requests and needed to compute for the requests.\\u003c/p\\u003e\\n\\u003cp\\u003eThis PEP would allow us to use a multi threaded server where we can exploit all the cores on our xeon’s and have the service scale with CPU cores.\\u003c/p\\u003e\",\"post_number\":7,\"post_type\":1,\"posts_count\":130,\"updated_at\":\"2023-01-10T22:36:34.956Z\",\"reply_count\":0,\"reply_to_post_number\":6,\"quote_count\":0,\"incoming_link_count\":15,\"reads\":418,\"readers_count\":417,\"score\":188.6,\"yours\":false,\"topic_id\":22606,\"topic_slug\":\"pep-703-making-the-global-interpreter-lock-optional\",\"display_username\":\"Barry Scott\",\"primary_group_name\":null,\"flair_name\":null,\"flair_url\":null,\"flair_bg_color\":null,\"flair_color\":null,\"flair_group_id\":null,\"badges_granted\":[],\"version\":1,\"can_edit\":false,\"can_delete\":false,\"can_recover\":false,\"can_see_hidden_post\":false,\"can_wiki\":false,\"read\":true,\"user_title\":null,\"reply_to_user\":{\"id\":1017,\"username\":\"h-vetinari\",\"name\":\"H. Vetinari\",\"avatar_template\":\"/user_avatar/discuss.python.org/h-vetinari/{size}/1220_2.png\"},\"bookmarked\":false,\"actions_summary\":[{\"id\":2,\"count\":2}],\"moderator\":false,\"admin\":false,\"staff\":false,\"user_id\":8068,\"hidden\":false,\"trust_level\":3,\"deleted_at\":null,\"user_deleted\":false,\"edit_reason\":null,\"can_view_edit_history\":true,\"wiki\":false,\"post_url\":\"/t/pep-703-making-the-global-interpreter-lock-optional/22606/7\",\"reactions\":[{\"id\":\"heart\",\"type\":\"emoji\",\"count\":2}],\"current_user_reaction\":null,\"reaction_users_count\":2,\"current_user_used_main_reaction\":false,\"can_accept_answer\":false,\"can_unaccept_answer\":false,\"accepted_answer\":false,\"topic_accepted_answer\":null},{\"id\":80740,\"name\":\"Jean Abou Samra\",\"username\":\"jeanas\",\"avatar_template\":\"/user_avatar/discuss.python.org/jeanas/{size}/8115_2.png\",\"created_at\":\"2023-01-10T23:38:57.092Z\",\"cooked\":\"\\u003caside class=\\\"quote group-committers\\\" data-username=\\\"ambv\\\" data-post=\\\"4\\\" data-topic=\\\"22606\\\"\\u003e\\n\\u003cdiv class=\\\"title\\\"\\u003e\\n\\u003cdiv class=\\\"quote-controls\\\"\\u003e\\u003c/div\\u003e\\n\\u003cimg alt=\\\"\\\" width=\\\"24\\\" height=\\\"24\\\" src=\\\"https://sea2.discourse-cdn.com/flex016/user_avatar/discuss.python.org/ambv/48/25884_2.png\\\" class=\\\"avatar\\\"\\u003e Łukasz Langa:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eHowever, \\u003cstrong\\u003eplease note\\u003c/strong\\u003e that on Discourse we avoid posts to show support / agree with the previous poster. Instead, we use the reactions:\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eThe problem is that there’s no way to express a stronger excitement than just “like” \\u003cimg src=\\\"https://emoji.discourse-cdn.com/apple/slight_smile.png?v=12\\\" title=\\\":slight_smile:\\\" class=\\\"emoji\\\" alt=\\\":slight_smile:\\\" loading=\\\"lazy\\\" width=\\\"20\\\" height=\\\"20\\\"\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eMinor note: perhaps the PEP should say what happens to the \\u003ccode\\u003egeneration\\u003c/code\\u003e argument of\\u003cbr\\u003e\\n\\u003ca href=\\\"https://docs.python.org/3/library/gc.html#gc.collect\\\" rel=\\\"noopener nofollow ugc\\\"\\u003egc.collect\\u003c/a\\u003e.\\u003c/p\\u003e\",\"post_number\":8,\"post_type\":1,\"posts_count\":130,\"updated_at\":\"2023-01-10T23:38:57.092Z\",\"reply_count\":1,\"reply_to_post_number\":null,\"quote_count\":1,\"incoming_link_count\":28,\"reads\":413,\"readers_count\":412,\"score\":227.6,\"yours\":false,\"topic_id\":22606,\"topic_slug\":\"pep-703-making-the-global-interpreter-lock-optional\",\"display_username\":\"Jean Abou Samra\",\"primary_group_name\":null,\"flair_name\":null,\"flair_url\":null,\"flair_bg_color\":null,\"flair_color\":null,\"flair_group_id\":null,\"badges_granted\":[],\"version\":1,\"can_edit\":false,\"can_delete\":false,\"can_recover\":false,\"can_see_hidden_post\":false,\"can_wiki\":false,\"link_counts\":[{\"url\":\"https://docs.python.org/3/library/gc.html#gc.collect\",\"internal\":false,\"reflection\":false,\"title\":\"gc — Garbage Collector interface — Python 3.11.1 documentation\",\"clicks\":22}],\"read\":true,\"user_title\":null,\"bookmarked\":false,\"actions_summary\":[],\"moderator\":false,\"admin\":false,\"staff\":false,\"user_id\":3079,\"hidden\":false,\"trust_level\":2,\"deleted_at\":null,\"user_deleted\":false,\"edit_reason\":null,\"can_view_edit_history\":true,\"wiki\":false,\"post_url\":\"/t/pep-703-making-the-global-interpreter-lock-optional/22606/8\",\"reactions\":[],\"current_user_reaction\":null,\"reaction_users_count\":0,\"current_user_used_main_reaction\":false,\"can_accept_answer\":false,\"can_unaccept_answer\":false,\"accepted_answer\":false,\"topic_accepted_answer\":null},{\"id\":80741,\"name\":\"Inada Naoki\",\"username\":\"methane\",\"avatar_template\":\"/user_avatar/discuss.python.org/methane/{size}/43_2.png\",\"created_at\":\"2023-01-11T00:07:10.583Z\",\"cooked\":\"\\u003cp\\u003eExcellent work.\\u003c/p\\u003e\\n\\u003cp\\u003eThis is nitpick but I don’t like \\u003ccode\\u003e--with(out)-gil\\u003c/code\\u003e option. \\u003ccode\\u003e--with\\u003c/code\\u003e option usually used for external dependency. Since we don’t need \\u003ccode\\u003e--with-gil=/path/to/libgil\\u003c/code\\u003e, I prefer \\u003ccode\\u003e--enable-gil / --disable-gil\\u003c/code\\u003e option.\\u003c/p\\u003e\\n\\u003cp\\u003eSee  \\u003ca href=\\\"https://autotools.info/autoconf/arguments.html\\\" class=\\\"inline-onebox\\\"\\u003e3.\\u0026nbsp;Adding Options\\u003c/a\\u003e for reference.\\u003c/p\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003e\\u003cstrong\\u003e\\u003ccode\\u003e--enable-*\\u003c/code\\u003e\\u003c/strong\\u003e/\\u003cstrong\\u003e\\u003ccode\\u003e--disable-*\\u003c/code\\u003e\\u003c/strong\\u003e arguments\\u003c/p\\u003e\\n\\u003cp\\u003eThe arguments starting with \\u003cstrong\\u003e–enable-\\u003c/strong\\u003e prefix are usually used to enable features of the program. They usually add or remove dependencies only if they are needed for that particular feature being enabled or disabled.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cstrong\\u003e\\u003ccode\\u003e--with-*\\u003c/code\\u003e\\u003c/strong\\u003e/\\u003cstrong\\u003e\\u003ccode\\u003e--without-*\\u003c/code\\u003e\\u003c/strong\\u003e arguments\\u003c/p\\u003e\\n\\u003cp\\u003eThe arguments starting with \\u003cstrong\\u003e–with-\\u003c/strong\\u003e prefix are usually used to add or remove dependencies on external projects. These might add or remove features from the project.\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\",\"post_number\":9,\"post_type\":1,\"posts_count\":130,\"updated_at\":\"2023-01-11T00:07:10.583Z\",\"reply_count\":1,\"reply_to_post_number\":null,\"quote_count\":0,\"incoming_link_count\":51,\"reads\":408,\"readers_count\":407,\"score\":671.6,\"yours\":false,\"topic_id\":22606,\"topic_slug\":\"pep-703-making-the-global-interpreter-lock-optional\",\"display_username\":\"Inada Naoki\",\"primary_group_name\":\"committers\",\"flair_name\":\"committers\",\"flair_url\":\"https://us1.discourse-cdn.com/flex002/uploads/python1/original/1X/ca0883b21b8210c5a62c9ac02353de5f24a4d6fc.png\",\"flair_bg_color\":\"006b94\",\"flair_color\":\"fac731\",\"flair_group_id\":41,\"badges_granted\":[],\"version\":1,\"can_edit\":false,\"can_delete\":false,\"can_recover\":false,\"can_see_hidden_post\":false,\"can_wiki\":false,\"link_counts\":[{\"url\":\"https://autotools.info/autoconf/arguments.html\",\"internal\":false,\"reflection\":false,\"title\":\"3. Adding Options\",\"clicks\":23}],\"read\":true,\"user_title\":\"CPython core developer\",\"title_is_group\":true,\"bookmarked\":false,\"actions_summary\":[{\"id\":2,\"count\":18}],\"moderator\":false,\"admin\":false,\"staff\":false,\"user_id\":42,\"hidden\":false,\"trust_level\":3,\"deleted_at\":null,\"user_deleted\":false,\"edit_reason\":null,\"can_view_edit_history\":true,\"wiki\":false,\"post_url\":\"/t/pep-703-making-the-global-interpreter-lock-optional/22606/9\",\"reactions\":[{\"id\":\"heart\",\"type\":\"emoji\",\"count\":18}],\"current_user_reaction\":null,\"reaction_users_count\":18,\"current_user_used_main_reaction\":false,\"can_accept_answer\":false,\"can_unaccept_answer\":false,\"accepted_answer\":false,\"topic_accepted_answer\":null},{\"id\":80756,\"name\":\"Greg Tan\",\"username\":\"gregington\",\"avatar_template\":\"https://avatars.discourse-cdn.com/v4/letter/g/c89c15/{size}.png\",\"created_at\":\"2023-01-11T02:47:47.001Z\",\"cooked\":\"\\u003cp\\u003eThe \\u003cstrong\\u003ePython Critical Sections\\u003c/strong\\u003e  part of the document describes how threads can only hold a single lock at a time to avoid deadlocks, where existing locks are released when a new lock is acquired.\\u003c/p\\u003e\\n\\u003cp\\u003eIf multiple locks are taken to ensure mutual consistency across multiple resources, is it possible that a second thread can acquire a released lock and make changes that are inconsistent with the work performed by the first thread? At first glance, this has the potential to violate program correctness in a multithreaded environment.\\u003c/p\\u003e\",\"post_number\":10,\"post_type\":1,\"posts_count\":130,\"updated_at\":\"2023-01-11T02:47:47.001Z\",\"reply_count\":1,\"reply_to_post_number\":null,\"quote_count\":0,\"incoming_link_count\":71,\"reads\":392,\"readers_count\":391,\"score\":438.4,\"yours\":false,\"topic_id\":22606,\"topic_slug\":\"pep-703-making-the-global-interpreter-lock-optional\",\"display_username\":\"Greg Tan\",\"primary_group_name\":null,\"flair_name\":null,\"flair_url\":null,\"flair_bg_color\":null,\"flair_color\":null,\"flair_group_id\":null,\"badges_granted\":[],\"version\":1,\"can_edit\":false,\"can_delete\":false,\"can_recover\":false,\"can_see_hidden_post\":false,\"can_wiki\":false,\"read\":true,\"user_title\":null,\"bookmarked\":false,\"actions_summary\":[],\"moderator\":false,\"admin\":false,\"staff\":false,\"user_id\":10173,\"hidden\":false,\"trust_level\":1,\"deleted_at\":null,\"user_deleted\":false,\"edit_reason\":null,\"can_view_edit_history\":true,\"wiki\":false,\"post_url\":\"/t/pep-703-making-the-global-interpreter-lock-optional/22606/10\",\"reactions\":[],\"current_user_reaction\":null,\"reaction_users_count\":0,\"current_user_used_main_reaction\":false,\"can_accept_answer\":false,\"can_unaccept_answer\":false,\"accepted_answer\":false,\"topic_accepted_answer\":null},{\"id\":80767,\"name\":\"Sam Gross\",\"username\":\"colesbury\",\"avatar_template\":\"/user_avatar/discuss.python.org/colesbury/{size}/28031_2.png\",\"created_at\":\"2023-01-11T05:08:41.451Z\",\"cooked\":\"\\u003caside class=\\\"quote no-group\\\" data-username=\\\"barry-scott\\\" data-post=\\\"5\\\" data-topic=\\\"22606\\\"\\u003e\\n\\u003cdiv class=\\\"title\\\"\\u003e\\n\\u003cdiv class=\\\"quote-controls\\\"\\u003e\\u003c/div\\u003e\\n\\u003cimg loading=\\\"lazy\\\" alt=\\\"\\\" width=\\\"24\\\" height=\\\"24\\\" src=\\\"https://avatars.discourse-cdn.com/v4/letter/b/e9c0ed/48.png\\\" class=\\\"avatar\\\"\\u003e Barry Scott:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eOr maybe PyCXX always uses the safe APIs starting with the first release of python with this implemented.\\u003c/p\\u003e\\n\\u003cp\\u003eIf a C extension uses an unsafe API will I get a compiler error?\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eHi Barry - I think you are referring to \\u003ccode\\u003ePyDict_GetItem\\u003c/code\\u003e vs. \\u003ccode\\u003ePyDict_FetchItem\\u003c/code\\u003e (and the list object equivalents). Let me know if you are referring to something else. For general context: the proposed new APIs (\\u003ccode\\u003ePyDict_FetchItem\\u003c/code\\u003e) return “new references”. The existing APIs (e.g., \\u003ccode\\u003ePyDict_GetItem\\u003c/code\\u003e) return “borrowed references.”  The borrowed references are sometimes unsafe without the GIL, such as when another thread might concurrently modify the container.\\u003c/p\\u003e\\n\\u003cp\\u003eThe PEP does \\u003cem\\u003enot\\u003c/em\\u003e propose making the borrowed reference versions a compile error (nor does it deprecate them). This for a few reasons:\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003eMany of the uses of \\u003ccode\\u003ePyDict/List_GetItem\\u003c/code\\u003e are safe even without the GIL. For example, accessing kwargs with PyDict_GetItem is safe because the kwargs generally cannot be modified by another thread.\\u003c/li\\u003e\\n\\u003cli\\u003eI tried this approach briefly early on, and, in my experience, wholesale replacing “borrowed references” with “new references” in existing code made it too easy to introduce new reference counting bugs.\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003cp\\u003eI think the risk of introducing new reference counting bugs generally outweighs the risks of missing a PyDict/List_GetItem call that’s unsafe without the GIL. That said, extension authors know their own code best, so if someone wants to replace \\u003ccode\\u003ePyDict_GetItem\\u003c/code\\u003e with \\u003ccode\\u003ePyDict_FetchItem\\u003c/code\\u003e they certainly can do so.\\u003c/p\\u003e\\n\\u003cp\\u003eI’ll add this reasoning to the PEP.\\u003c/p\\u003e\",\"post_number\":11,\"post_type\":1,\"posts_count\":130,\"updated_at\":\"2023-01-11T05:08:41.451Z\",\"reply_count\":1,\"reply_to_post_number\":5,\"quote_count\":1,\"incoming_link_count\":27,\"reads\":391,\"readers_count\":390,\"score\":263.2,\"yours\":false,\"topic_id\":22606,\"topic_slug\":\"pep-703-making-the-global-interpreter-lock-optional\",\"display_username\":\"Sam Gross\",\"primary_group_name\":\"committers\",\"flair_name\":\"committers\",\"flair_url\":\"https://us1.discourse-cdn.com/flex002/uploads/python1/original/1X/ca0883b21b8210c5a62c9ac02353de5f24a4d6fc.png\",\"flair_bg_color\":\"006b94\",\"flair_color\":\"fac731\",\"flair_group_id\":41,\"badges_granted\":[],\"version\":1,\"can_edit\":false,\"can_delete\":false,\"can_recover\":false,\"can_see_hidden_post\":false,\"can_wiki\":false,\"read\":true,\"user_title\":\"CPython core developer\",\"title_is_group\":true,\"bookmarked\":false,\"actions_summary\":[{\"id\":2,\"count\":3}],\"moderator\":false,\"admin\":false,\"staff\":false,\"user_id\":7972,\"hidden\":false,\"trust_level\":3,\"deleted_at\":null,\"user_deleted\":false,\"edit_reason\":null,\"can_view_edit_history\":true,\"wiki\":false,\"post_url\":\"/t/pep-703-making-the-global-interpreter-lock-optional/22606/11\",\"reactions\":[{\"id\":\"heart\",\"type\":\"emoji\",\"count\":3}],\"current_user_reaction\":null,\"reaction_users_count\":3,\"current_user_used_main_reaction\":false,\"can_accept_answer\":false,\"can_unaccept_answer\":false,\"accepted_answer\":false,\"topic_accepted_answer\":null},{\"id\":80778,\"name\":\"Sam Gross\",\"username\":\"colesbury\",\"avatar_template\":\"/user_avatar/discuss.python.org/colesbury/{size}/28031_2.png\",\"created_at\":\"2023-01-11T06:06:26.305Z\",\"cooked\":\"\\u003caside class=\\\"quote no-group\\\" data-username=\\\"h-vetinari\\\" data-post=\\\"6\\\" data-topic=\\\"22606\\\"\\u003e\\n\\u003cdiv class=\\\"title\\\"\\u003e\\n\\u003cdiv class=\\\"quote-controls\\\"\\u003e\\u003c/div\\u003e\\n\\u003cimg loading=\\\"lazy\\\" alt=\\\"\\\" width=\\\"24\\\" height=\\\"24\\\" src=\\\"https://sea2.discourse-cdn.com/flex016/user_avatar/discuss.python.org/h-vetinari/48/1220_2.png\\\" class=\\\"avatar\\\"\\u003e H. Vetinari:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eI’m surprised to see this diverge from existing efforts in the same direction. Is it impossible to make nogil work with PEP 683 semantics, should PEP 683 be modified, or what are the trade-offs (performance?) if PEP 683 were used as is?\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003ePEP 683 tries to be compatible with the stable ABI (abi3) and makes some trade-offs to support that, such as putting the immortal bit as the 2nd highest bit. You could make this PEP look more like a bit more like PEP 683 (by placing the immortal bit in the same spot), but I think it would only be superficial similarity because this PEP depends on biased reference counting (there are two reference counting fields instead of one), so the overall reference counting scheme is going to be different regardless. On x86-64, using one of the low bits instead of the 2nd highest bit makes checking if an object is immortal a teeny bit faster. I don’t think PEP 683 should be changed – I think it’s a good solution given the constraints of ABI stability. I’ll wait a bit to see if there are more comments on immortalization and then try to summarize this in the PEP.\\u003c/p\\u003e\\n\\u003cp\\u003eRegarding motivation: I’m hoping that people that use Python for the many other use cases not mentioned in the PEP can weigh in here about either the problems the GIL poses for them or with their concerns about this PEP.  To the extent that there are common themes, I’ll try to capture them in the PEP.\\u003c/p\\u003e\\n\\u003cp\\u003eRegarding the build modes: I \\u003ca href=\\\"https://peps.python.org/pep-0703/#python-build-modes\\\" rel=\\\"noopener nofollow ugc\\\"\\u003ewrote\\u003c/a\\u003e this in the PEP, but my hope is for the two build modes to be temporary. I think having two build modes – for a short period – is worthwhile because it reduces the risks during integration into CPython and gives a bit more time for extensions to adapt. I don’t really see the build modes as a means for extension authors to “opt-out” of supporting it, although it’s possible it’s used that way. Like you, I think there will be pressure from users on extension authors to support it, and I think that pressure will be because the users see value in running without the GIL.\\u003c/p\\u003e\",\"post_number\":12,\"post_type\":1,\"posts_count\":130,\"updated_at\":\"2023-01-11T06:06:26.305Z\",\"reply_count\":1,\"reply_to_post_number\":6,\"quote_count\":1,\"incoming_link_count\":19,\"reads\":363,\"readers_count\":362,\"score\":172.6,\"yours\":false,\"topic_id\":22606,\"topic_slug\":\"pep-703-making-the-global-interpreter-lock-optional\",\"display_username\":\"Sam Gross\",\"primary_group_name\":\"committers\",\"flair_name\":\"committers\",\"flair_url\":\"https://us1.discourse-cdn.com/flex002/uploads/python1/original/1X/ca0883b21b8210c5a62c9ac02353de5f24a4d6fc.png\",\"flair_bg_color\":\"006b94\",\"flair_color\":\"fac731\",\"flair_group_id\":41,\"badges_granted\":[],\"version\":1,\"can_edit\":false,\"can_delete\":false,\"can_recover\":false,\"can_see_hidden_post\":false,\"can_wiki\":false,\"link_counts\":[{\"url\":\"https://peps.python.org/pep-0703/#python-build-modes\",\"internal\":false,\"reflection\":false,\"title\":\"PEP 703 – Making the Global Interpreter Lock Optional in CPython | peps.python.org\",\"clicks\":6}],\"read\":true,\"user_title\":\"CPython core developer\",\"title_is_group\":true,\"bookmarked\":false,\"actions_summary\":[],\"moderator\":false,\"admin\":false,\"staff\":false,\"user_id\":7972,\"hidden\":false,\"trust_level\":3,\"deleted_at\":null,\"user_deleted\":false,\"edit_reason\":null,\"can_view_edit_history\":true,\"wiki\":false,\"post_url\":\"/t/pep-703-making-the-global-interpreter-lock-optional/22606/12\",\"reactions\":[],\"current_user_reaction\":null,\"reaction_users_count\":0,\"current_user_used_main_reaction\":false,\"can_accept_answer\":false,\"can_unaccept_answer\":false,\"accepted_answer\":false,\"topic_accepted_answer\":null},{\"id\":80780,\"name\":\"Sam Gross\",\"username\":\"colesbury\",\"avatar_template\":\"/user_avatar/discuss.python.org/colesbury/{size}/28031_2.png\",\"created_at\":\"2023-01-11T06:10:07.329Z\",\"cooked\":\"\\u003caside class=\\\"quote group-committers\\\" data-username=\\\"methane\\\" data-post=\\\"9\\\" data-topic=\\\"22606\\\"\\u003e\\n\\u003cdiv class=\\\"title\\\"\\u003e\\n\\u003cdiv class=\\\"quote-controls\\\"\\u003e\\u003c/div\\u003e\\n\\u003cimg loading=\\\"lazy\\\" alt=\\\"\\\" width=\\\"24\\\" height=\\\"24\\\" src=\\\"https://sea2.discourse-cdn.com/flex016/user_avatar/discuss.python.org/methane/48/43_2.png\\\" class=\\\"avatar\\\"\\u003e Inada Naoki:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eI prefer \\u003ccode\\u003e--enable-gil / --disable-gil\\u003c/code\\u003e option.\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eI like \\u003ccode\\u003e--enable-gil / --disable-gil\\u003c/code\\u003e too. I’ll wait a bit to see if there are additional comments on the build option naming and then update the PEP.\\u003c/p\\u003e\",\"post_number\":13,\"post_type\":1,\"posts_count\":130,\"updated_at\":\"2023-01-11T06:10:07.329Z\",\"reply_count\":0,\"reply_to_post_number\":9,\"quote_count\":1,\"incoming_link_count\":8,\"reads\":333,\"readers_count\":332,\"score\":196.6,\"yours\":false,\"topic_id\":22606,\"topic_slug\":\"pep-703-making-the-global-interpreter-lock-optional\",\"display_username\":\"Sam Gross\",\"primary_group_name\":\"committers\",\"flair_name\":\"committers\",\"flair_url\":\"https://us1.discourse-cdn.com/flex002/uploads/python1/original/1X/ca0883b21b8210c5a62c9ac02353de5f24a4d6fc.png\",\"flair_bg_color\":\"006b94\",\"flair_color\":\"fac731\",\"flair_group_id\":41,\"badges_granted\":[],\"version\":1,\"can_edit\":false,\"can_delete\":false,\"can_recover\":false,\"can_see_hidden_post\":false,\"can_wiki\":false,\"read\":true,\"user_title\":\"CPython core developer\",\"title_is_group\":true,\"bookmarked\":false,\"actions_summary\":[{\"id\":2,\"count\":6}],\"moderator\":false,\"admin\":false,\"staff\":false,\"user_id\":7972,\"hidden\":false,\"trust_level\":3,\"deleted_at\":null,\"user_deleted\":false,\"edit_reason\":null,\"can_view_edit_history\":true,\"wiki\":false,\"post_url\":\"/t/pep-703-making-the-global-interpreter-lock-optional/22606/13\",\"reactions\":[{\"id\":\"heart\",\"type\":\"emoji\",\"count\":6}],\"current_user_reaction\":null,\"reaction_users_count\":6,\"current_user_used_main_reaction\":false,\"can_accept_answer\":false,\"can_unaccept_answer\":false,\"accepted_answer\":false,\"topic_accepted_answer\":null},{\"id\":80782,\"name\":\"Peter Suter\",\"username\":\"petersuter\",\"avatar_template\":\"https://avatars.discourse-cdn.com/v4/letter/p/13edae/{size}.png\",\"created_at\":\"2023-01-11T07:10:04.797Z\",\"cooked\":\"\\u003cp\\u003eWhat is the impact on packaging, wheel tags, PyPI, pip, python org installers etc.?\\u003c/p\\u003e\",\"post_number\":14,\"post_type\":1,\"posts_count\":130,\"updated_at\":\"2023-01-11T07:10:04.797Z\",\"reply_count\":0,\"reply_to_post_number\":null,\"quote_count\":0,\"incoming_link_count\":7,\"reads\":329,\"readers_count\":328,\"score\":130.8,\"yours\":false,\"topic_id\":22606,\"topic_slug\":\"pep-703-making-the-global-interpreter-lock-optional\",\"display_username\":\"Peter Suter\",\"primary_group_name\":null,\"flair_name\":null,\"flair_url\":null,\"flair_bg_color\":null,\"flair_color\":null,\"flair_group_id\":null,\"badges_granted\":[],\"version\":1,\"can_edit\":false,\"can_delete\":false,\"can_recover\":false,\"can_see_hidden_post\":false,\"can_wiki\":false,\"read\":true,\"user_title\":\"\",\"bookmarked\":false,\"actions_summary\":[{\"id\":2,\"count\":2}],\"moderator\":false,\"admin\":false,\"staff\":false,\"user_id\":95,\"hidden\":false,\"trust_level\":2,\"deleted_at\":null,\"user_deleted\":false,\"edit_reason\":null,\"can_view_edit_history\":true,\"wiki\":false,\"post_url\":\"/t/pep-703-making-the-global-interpreter-lock-optional/22606/14\",\"reactions\":[{\"id\":\"heart\",\"type\":\"emoji\",\"count\":2}],\"current_user_reaction\":null,\"reaction_users_count\":2,\"current_user_used_main_reaction\":false,\"can_accept_answer\":false,\"can_unaccept_answer\":false,\"accepted_answer\":false,\"topic_accepted_answer\":null},{\"id\":80783,\"name\":\"H. Vetinari\",\"username\":\"h-vetinari\",\"avatar_template\":\"/user_avatar/discuss.python.org/h-vetinari/{size}/1220_2.png\",\"created_at\":\"2023-01-11T07:14:55.118Z\",\"cooked\":\"\\u003cp\\u003eThanks for the response!\\u003c/p\\u003e\\n\\u003caside class=\\\"quote group-committers quote-modified\\\" data-username=\\\"colesbury\\\" data-post=\\\"12\\\" data-topic=\\\"22606\\\"\\u003e\\n\\u003cdiv class=\\\"title\\\"\\u003e\\n\\u003cdiv class=\\\"quote-controls\\\"\\u003e\\u003c/div\\u003e\\n\\u003cimg alt=\\\"\\\" width=\\\"24\\\" height=\\\"24\\\" src=\\\"https://sea2.discourse-cdn.com/flex002/user_avatar/discuss.python.org/colesbury/48/28031_2.png\\\" class=\\\"avatar\\\"\\u003e Sam Gross:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003ePEP 683 tries to be compatible with the stable ABI (abi3) and makes some trade-offs to support that, such as putting the immortal bit as the 2nd highest bit. […] I don’t think PEP 683 should be changed – I think it’s a good solution given the constraints of ABI stability.\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eSo if I’m reading this (and the PEP) correctly:\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003enogil needs \\u003cem\\u003eboth\\u003c/em\\u003e biased \\u0026amp; deferred reference counting (for thread safety resp. performance)\\u003c/li\\u003e\\n\\u003cli\\u003enogil needs a break of the stable ABI\\u003csup class=\\\"footnote-ref\\\"\\u003e\\u003ca href=\\\"#footnote-80783-1\\\" id=\\\"footnote-ref-80783-1\\\"\\u003e[1]\\u003c/a\\u003e\\u003c/sup\\u003e\\u003c/li\\u003e\\n\\u003cli\\u003eit’s thus independent of PEP 683, but would replace(?) PEP 683’s changes in this space with its own\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003caside class=\\\"quote group-committers\\\" data-username=\\\"colesbury\\\" data-post=\\\"12\\\" data-topic=\\\"22606\\\"\\u003e\\n\\u003cdiv class=\\\"title\\\"\\u003e\\n\\u003cdiv class=\\\"quote-controls\\\"\\u003e\\u003c/div\\u003e\\n\\u003cimg alt=\\\"\\\" width=\\\"24\\\" height=\\\"24\\\" src=\\\"https://sea2.discourse-cdn.com/flex002/user_avatar/discuss.python.org/colesbury/48/28031_2.png\\\" class=\\\"avatar\\\"\\u003e Sam Gross:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eRegarding the build modes: I \\u003ca href=\\\"https://peps.python.org/pep-0703/#python-build-modes\\\" rel=\\\"noopener nofollow ugc\\\"\\u003ewrote\\u003c/a\\u003e this in the PEP, but my hope is for the two build modes to be temporary. I think having two build modes – for a short period – is worthwhile because it reduces the risks during integration into CPython and gives a bit more time for extensions to adapt.\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eNot to nitpick, but the linked section says “These may be worthwhile if a longer term goal is to have a single build mode”, which is… at odds… with “for a short period”. BTW, this choice is a really hard problem, and it’s fine that the PEP doesn’t really commit to a timeline, but IMO those trade-offs (additional build mode – what would that imply over short/long term? – or new default) could use some more discussion.\\u003c/p\\u003e\\n\\u003caside class=\\\"quote group-committers\\\" data-username=\\\"colesbury\\\" data-post=\\\"12\\\" data-topic=\\\"22606\\\"\\u003e\\n\\u003cdiv class=\\\"title\\\"\\u003e\\n\\u003cdiv class=\\\"quote-controls\\\"\\u003e\\u003c/div\\u003e\\n\\u003cimg alt=\\\"\\\" width=\\\"24\\\" height=\\\"24\\\" src=\\\"https://sea2.discourse-cdn.com/flex002/user_avatar/discuss.python.org/colesbury/48/28031_2.png\\\" class=\\\"avatar\\\"\\u003e Sam Gross:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eI don’t really see the build modes as a means for extension authors to “opt-out” of supporting it, although it’s possible it’s used that way. Like you, I think there will be pressure from users on extension authors to support it, and I think that pressure will be because the users see value in running without the GIL.\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eI absolutely see libraries opting out of this, at least for a while (e.g. “making our library threadsafe needs a large overhaul of core component X, and we’ll do it in the next Y months”), which will create a situation where people want to install a given library on the nogil ABI, only to find out that it doesn’t exist (or worse: since there are no nogil-wheels, it falls back to trying to install from source) – would pip even be able to take the python ABI flavour into account for the resolver, resp. give a reasonable error?\\u003c/p\\u003e\\n\\u003cp\\u003eIt’s also going to create confusion for users who have no idea what an ABI is, when a library advertises itself as “we support Python 3.12 (but not nogil)”, and then users need to understand that distinction.\\u003c/p\\u003e\\n\\u003cp\\u003eThe least painful scenario I could imagine (very subjective, obviously) is to redeclare Python 3.13 as 4.0, no additional build mode but with changed ABI, merge nogil immediately after branching 3.12 (and publish an alpha right after), then work with the extension ecosystem over the following year to get as far as possible in getting the most used libraries “4.0/nogil-ready”. I know you have some experience with that already with the libraries you patched for the existing nogil fork, but it’s gonna take a while for the ecosystem to digest such a change IMO (whether with a separate build mode or not\\u003csup class=\\\"footnote-ref\\\"\\u003e\\u003ca href=\\\"#footnote-80783-2\\\" id=\\\"footnote-ref-80783-2\\\"\\u003e[2]\\u003c/a\\u003e\\u003c/sup\\u003e).\\u003c/p\\u003e\\n\\u003chr class=\\\"footnotes-sep\\\"\\u003e\\n\\n\\u003col class=\\\"footnotes-list\\\"\\u003e\\n\\u003cli id=\\\"footnote-80783-1\\\" class=\\\"footnote-item\\\"\\u003e\\u003cp\\u003ethat in and of itself probably makes it “Python 4.0” material? \\u003ca href=\\\"#footnote-ref-80783-1\\\" class=\\\"footnote-backref\\\"\\u003e↩︎\\u003c/a\\u003e\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003cli id=\\\"footnote-80783-2\\\" class=\\\"footnote-item\\\"\\u003e\\u003cp\\u003eI just think a changed default will cause less friction overall, rather than subjecting the library maintainers (as well as tooling \\u0026amp; infrastructure) to having to deal with both modes + users who can’t wait for nogil either way. \\u003ca href=\\\"#footnote-ref-80783-2\\\" class=\\\"footnote-backref\\\"\\u003e↩︎\\u003c/a\\u003e\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003c/ol\\u003e\",\"post_number\":15,\"post_type\":1,\"posts_count\":130,\"updated_at\":\"2023-01-11T07:47:50.251Z\",\"reply_count\":1,\"reply_to_post_number\":12,\"quote_count\":1,\"incoming_link_count\":29,\"reads\":357,\"readers_count\":356,\"score\":356.4,\"yours\":false,\"topic_id\":22606,\"topic_slug\":\"pep-703-making-the-global-interpreter-lock-optional\",\"display_username\":\"H. Vetinari\",\"primary_group_name\":null,\"flair_name\":null,\"flair_url\":null,\"flair_bg_color\":null,\"flair_color\":null,\"flair_group_id\":null,\"badges_granted\":[],\"version\":2,\"can_edit\":false,\"can_delete\":false,\"can_recover\":false,\"can_see_hidden_post\":false,\"can_wiki\":false,\"link_counts\":[{\"url\":\"https://discuss.python.org/t/pep-703-making-the-global-interpreter-lock-optional-3-12-updates/26503/102\",\"internal\":true,\"reflection\":true,\"title\":\"PEP 703: Making the Global Interpreter Lock Optional (3.12 updates)\",\"clicks\":4},{\"url\":\"https://discuss.python.org/t/pep-703-making-the-global-interpreter-lock-optional-3-12-updates/26503/61\",\"internal\":true,\"reflection\":true,\"title\":\"PEP 703: Making the Global Interpreter Lock Optional (3.12 updates)\",\"clicks\":0}],\"read\":true,\"user_title\":null,\"bookmarked\":false,\"actions_summary\":[{\"id\":2,\"count\":9}],\"moderator\":false,\"admin\":false,\"staff\":false,\"user_id\":1017,\"hidden\":false,\"trust_level\":2,\"deleted_at\":null,\"user_deleted\":false,\"edit_reason\":null,\"can_view_edit_history\":true,\"wiki\":false,\"post_url\":\"/t/pep-703-making-the-global-interpreter-lock-optional/22606/15\",\"reactions\":[{\"id\":\"heart\",\"type\":\"emoji\",\"count\":9}],\"current_user_reaction\":null,\"reaction_users_count\":9,\"current_user_used_main_reaction\":false,\"can_accept_answer\":false,\"can_unaccept_answer\":false,\"accepted_answer\":false,\"topic_accepted_answer\":null},{\"id\":80787,\"name\":\"Petr Viktorin\",\"username\":\"encukou\",\"avatar_template\":\"/user_avatar/discuss.python.org/encukou/{size}/2461_2.png\",\"created_at\":\"2023-01-11T08:49:45.859Z\",\"cooked\":\"\\u003cp\\u003eThis would place a huge burden on authors of third-party C-API extensions. I don’t see how we could have nogil without a situation similar to the Python 2→3 transition – two incompatible versions of Python existing in parallel for a long time.\\u003c/p\\u003e\",\"post_number\":16,\"post_type\":1,\"posts_count\":130,\"updated_at\":\"2023-01-11T08:49:45.859Z\",\"reply_count\":2,\"reply_to_post_number\":null,\"quote_count\":0,\"incoming_link_count\":12,\"reads\":336,\"readers_count\":335,\"score\":317.2,\"yours\":false,\"topic_id\":22606,\"topic_slug\":\"pep-703-making-the-global-interpreter-lock-optional\",\"display_username\":\"Petr Viktorin\",\"primary_group_name\":\"committers\",\"flair_name\":null,\"flair_url\":null,\"flair_bg_color\":null,\"flair_color\":null,\"flair_group_id\":null,\"badges_granted\":[],\"version\":1,\"can_edit\":false,\"can_delete\":false,\"can_recover\":false,\"can_see_hidden_post\":false,\"can_wiki\":false,\"read\":true,\"user_title\":\"CPython core developer\",\"title_is_group\":true,\"bookmarked\":false,\"actions_summary\":[{\"id\":2,\"count\":10}],\"moderator\":true,\"admin\":true,\"staff\":true,\"user_id\":26,\"hidden\":false,\"trust_level\":3,\"deleted_at\":null,\"user_deleted\":false,\"edit_reason\":null,\"can_view_edit_history\":true,\"wiki\":false,\"post_url\":\"/t/pep-703-making-the-global-interpreter-lock-optional/22606/16\",\"reactions\":[{\"id\":\"heart\",\"type\":\"emoji\",\"count\":10}],\"current_user_reaction\":null,\"reaction_users_count\":10,\"current_user_used_main_reaction               <p>Hi <img src="https://emoji.discourse-cdn.com/apple/wave.png?v=15" title=":wave:" class="emoji" alt=":wave:" loading="lazy" width="20" height="20"></p>
<p>As the sponsor of <a class="mention" href="/u/colesbury">@colesbury</a>’s PEP, I’d like to invite you all to discuss the proposal to solve the biggest scalability limitation of CPython by making it possible to build a version of the interpreter which doesn’t use the Global Interpreter Lock.</p>
<p>The document is somewhat of a demanding read as it’s one of the top 10 longest PEPs. That was to be expected though as the problem goes back decades and requires nuance, trade-offs, and careful consideration of alternatives. Thanks in advance for your time reading the PEP and iterating on it with us.</p>
<p>Our hope with this PEP is to get a definitive answer to the GIL question once and for all. We look forward to your feedback!</p>
<p>– Sam Gross and Łukasz Langa</p>
<h1><a name="p-80646-see-the-latest-version-of-the-pep-1" class="anchor" href="#p-80646-see-the-latest-version-of-the-pep-1" aria-label="Heading link"></a>See the latest version of the PEP</h1>

<h3><a href="https://peps.python.org/pep-0703/" target="_blank" rel="noopener">PEP 703 – Making the Global Interpreter Lock Optional in CPython |...</a></h3>

  <p>CPython’s global interpreter lock (“GIL”) prevents multiple threads from executing Python code at the same time.  The GIL is an obstacle to using multi-core CPUs from Python efficiently.  This PEP proposes adding a build configuration (--disable-gil)...</p>

            <div class='post' itemprop="text">
              <p>Congratulations on this PEP! <img src="https://emoji.discourse-cdn.com/apple/partying_face.png?v=12" title=":partying_face:" class="emoji" alt=":partying_face:" loading="lazy" width="20" height="20"></p>
<aside class="quote no-group">
<blockquote>
<p>This proposed immortalization scheme is very similar to PEP 683, but with slightly different bit representation in the reference count fields for immortal objects in order to work with biased reference counting and deferred reference counting.</p>
</blockquote>
</aside>
<p>I’m surprised to see this diverge from existing efforts in the same direction. Is it impossible to make nogil work with PEP 683 semantics, should PEP 683 be modified, or what are the trade-offs (performance?) if PEP 683 were used as is?</p>
<p>Another point that struck me is that, despite investing a lot of digital ink into testimonials, the motivation is almost exclusively ML/AI and scientific computing. I imagine it’s hard to capture the vast volume of discussions on this topic, but my impression is that it does a disservice to the PEP to not cover the impact on other usecases as well, especially considering how the addition of another build mode / ABI will create enormous pressure for <em>all</em> extension library authors to support it.</p>
<p>In fact, I suspect that pressure would be so high that there wouldn’t be much of a difference to just declaring it as the new default, which then leaves all of the downsides of building everything twice, with few of the benefits of having a build option in the first place<sup class="footnote-ref"><a href="#footnote-80717-1" id="footnote-ref-80717-1">[1]</a></sup>.</p>
<hr class="footnotes-sep">

<ol class="footnotes-list">
<li id="footnote-80717-1" class="footnote-item"><p>Perhaps it might be better to just use this as a “Python 4.0” event, which would at least give library authors something to point to à la “a lot of things changed and we’ll need some time to adapt our library to it”. <a href="#footnote-ref-80717-1" class="footnote-backref">↩︎</a></p>
</li>

            <div class='post' itemprop="text">
              <p>The <strong>Python Critical Sections</strong>  part of the document describes how threads can only hold a single lock at a time to avoid deadlocks, where existing locks are released when a new lock is acquired.</p>
<p>If multiple locks are taken to ensure mutual consistency across multiple resources, is it possible that a second thread can acquire a released lock and make changes that are inconsistent with the work performed by the first thread? At first glance, this has the potential to violate program correctness in a multithreaded environment.</p>

<img loading="lazy" alt="" width="24" height="24" src="https://avatars.discourse-cdn.com/v4/letter/b/e9c0ed/48.png" class="avatar"> Barry Scott:</div>
<blockquote>
<p>Or maybe PyCXX always uses the safe APIs starting with the first release of python with this implemented.</p>
<p>If a C extension uses an unsafe API will I get a compiler error?</p>
</blockquote>
</aside>
<p>Hi Barry - I think you are referring to <code>PyDict_GetItem</code> vs. <code>PyDict_FetchItem</code> (and the list object equivalents). Let me know if you are referring to something else. For general context: the proposed new APIs (<code>PyDict_FetchItem</code>) return “new references”. The existing APIs (e.g., <code>PyDict_GetItem</code>) return “borrowed references.”  The borrowed references are sometimes unsafe without the GIL, such as when another thread might concurrently modify the container.</p>
<p>The PEP does <em>not</em> propose making the borrowed reference versions a compile error (nor does it deprecate them). This for a few reasons:</p>
<ul>
<li>Many of the uses of <code>PyDict/List_GetItem</code> are safe even without the GIL. For example, accessing kwargs with PyDict_GetItem is safe because the kwargs generally cannot be modified by another thread.</li>
<li>I tried this approach briefly early on, and, in my experience, wholesale replacing “borrowed references” with “new references” in existing code made it too easy to introduce new reference counting bugs.</li>
</ul>
<p>I think the risk of introducing new reference counting bugs generally outweighs the risks of missing a PyDict/List_GetItem call that’s unsafe without the GIL. That said, extension authors know their own code best, so if someone wants to replace <code>PyDict_GetItem</code> with <code>PyDict_FetchItem</code> they certainly can do so.</p>
<p>I’ll add this reasoning to the PEP.</p>
            </div>

<img loading="lazy" alt="" width="24" height="24" src="https://sea2.discourse-cdn.com/flex016/user_avatar/discuss.python.org/h-vetinari/48/1220_2.png" class="avatar"> H. Vetinari:</div>
<blockquote>
<p>I’m surprised to see this diverge from existing efforts in the same direction. Is it impossible to make nogil work with PEP 683 semantics, should PEP 683 be modified, or what are the trade-offs (performance?) if PEP 683 were used as is?</p>
</blockquote>
</aside>
<p>PEP 683 tries to be compatible with the stable ABI (abi3) and makes some trade-offs to support that, such as putting the immortal bit as the 2nd highest bit. You could make this PEP look more like a bit more like PEP 683 (by placing the immortal bit in the same spot), but I think it would only be superficial similarity because this PEP depends on biased reference counting (there are two reference counting fields instead of one), so the overall reference counting scheme is going to be different regardless. On x86-64, using one of the low bits instead of the 2nd highest bit makes checking if an object is immortal a teeny bit faster. I don’t think PEP 683 should be changed – I think it’s a good solution given the constraints of ABI stability. I’ll wait a bit to see if there are more comments on immortalization and then try to summarize this in the PEP.</p>
<p>Regarding motivation: I’m hoping that people that use Python for the many other use cases not mentioned in the PEP can weigh in here about either the problems the GIL poses for them or with their concerns about this PEP.  To the extent that there are common themes, I’ll try to capture them in the PEP.</p>
<p>Regarding the build modes: I <a href="https://peps.python.org/pep-0703/#python-build-modes" rel="noopener nofollow ugc">wrote</a> this in the PEP, but my hope is for the two build modes to be temporary. I think having two build modes – for a short period – is worthwhile because it reduces the risks during integration into CPython and gives a bit more time for extensions to adapt. I don’t really see the build modes as a means for extension authors to “opt-out” of supporting it, although it’s possible it’s used that way. Like you, I think there will be pressure from users on extension authors to support it, and I think that pressure will be because the users see value in running without the GIL.</p>
            </div>

              <p>Thanks for the response!</p>
<aside class="quote group-committers quote-modified" data-username="colesbury" data-post="12" data-topic="22606">
<div class="title">
<div class="quote-controls"></div>
<img alt="" width="24" height="24" src="https://sea2.discourse-cdn.com/flex002/user_avatar/discuss.python.org/colesbury/48/28031_2.png" class="avatar"> Sam Gross:</div>
<blockquote>
<p>PEP 683 tries to be compatible with the stable ABI (abi3) and makes some trade-offs to support that, such as putting the immortal bit as the 2nd highest bit. […] I don’t think PEP 683 should be changed – I think it’s a good solution given the constraints of ABI stability.</p>

</aside>
<p>So if I’m reading this (and the PEP) correctly:</p>
<ul>
<li>nogil needs <em>both</em> biased &amp; deferred reference counting (for thread safety resp. performance)</li>
<li>nogil needs a break of the stable ABI<sup class="footnote-ref"><a href="#footnote-80783-1" id="footnote-ref-80783-1">[1]</a></sup></li>

<aside class="quote group-committers" data-username="colesbury" data-post="12" data-topic="22606">
<div class="title">

<img alt="" width="24" height="24" src="https://sea2.discourse-cdn.com/flex002/user_avatar/discuss.python.org/colesbury/48/28031_2.png" class="avatar"> Sam Gross:</div>
<blockquote>
<p>Regarding the build modes: I <a href="https://peps.python.org/pep-0703/#python-build-modes" rel="noopener nofollow ugc">wrote</a> this in the PEP, but my hope is for the two build modes to be temporary. I think having two build modes – for a short period – is worthwhile because it reduces the risks during integration into CPython and gives a bit more time for extensions to adapt.</p>
</blockquote>
</aside>
<p>Not to nitpick, but the linked section says “These may be worthwhile if a longer term goal is to have a single build mode”, which is… at odds… with “for a short period”. BTW, this choice is a really hard problem, and it’s fine that the PEP doesn’t really commit to a timeline, but IMO those trade-offs (additional build mode – what would that imply over short/long term? – or new default) could use some more discussion.</p>
<aside class="quote group-committers" data-username="colesbury" data-post="12" data-topic="22606">
<div class="title">
<div class="quote-controls"></div>
<img alt="" width="24" height="24" src="https://sea2.discourse-cdn.com/flex002/user_avatar/discuss.python.org/colesbury/48/28031_2.png" class="avatar"> Sam Gross:</div>
<blockquote>
<p>I don’t really see the build modes as a means for extension authors to “opt-out” of supporting it, although it’s possible it’s used that way. Like you, I think there will be pressure from users on extension authors to support it, and I think that pressure will be because the users see value in running without the GIL.</p>
</blockquote>
</aside>
<p>I absolutely see libraries opting out of this, at least for a while (e.g. “making our library threadsafe needs a large overhaul of core component X, and we’ll do it in the next Y months”), which will create a situation where people want to install a given library on the nogil ABI, only to find out that it doesn’t exist (or worse: since there are no nogil-wheels, it falls back to trying to install from source) – would pip even be able to take the python ABI flavour into account for the resolver, resp. give a reasonable error?</p>
<p>It’s also going to create confusion for users who have no idea what an ABI is, when a library advertises itself as “we support Python 3.12 (but not nogil)”, and then users need to understand that distinction.</p>
<p>The least painful scenario I could imagine (very subjective, obviously) is to redeclare Python 3.13 as 4.0, no additional build mode but with changed ABI, merge nogil immediately after branching 3.12 (and publish an alpha right after), then work with the extension ecosystem over the following year to get as far as possible in getting the most used libraries “4.0/nogil-ready”. I know you have some experience with that already with the libraries you patched for the existing nogil fork, but it’s gonna take a while for the ecosystem to digest such a change IMO (whether with a separate build mode or not<sup class="footnote-ref"><a href="#footnote-80783-2" id="footnote-ref-80783-2">[2]</a></sup>).</p>
<hr class="footnotes-sep">

<ol class="footnotes-list">
<li id="footnote-80783-1" class="footnote-item"><p>that in and of itself probably makes it “Python 4.0” material? <a href="#footnote-ref-80783-1" class="footnote-backref">↩︎</a></p>
</li>
<li id="footnote-80783-2" class="footnote-item"><p>I just think a changed default will cause less friction overall, rather than subjecting the library maintainers (as well as tooling &amp; infrastructure) to having to deal with both modes + users who can’t wait for nogil either way. <a href="#footnote-ref-80783-2" class="footnote-backref">↩︎</a></p>
</li>
</ol>
